<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Code‑X | Home</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <script src="scripts/main.js" defer></script>

  <style>
    /* Start Experience Overlay */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9998;
    }

    #start-btn {
      padding: 18px 40px;
      font-size: 22px;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 20px #3b82f6;
    }

    /* Fullscreen Intro */
    #intro-container {
      position: fixed;
      inset: 0;
      background: black;
      display: none;
      z-index: 9999;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Hide main site until intro ends */
    #site-content {
      display: none;
    }
  </style>
</head>

<body>

  <!-- START EXPERIENCE OVERLAY -->
  <div id="start-overlay">
    <button id="start-btn">Start Experience</button>
  </div>

  <!-- FULLSCREEN INTRO -->
  <div id="intro-container">
    <video id="intro-video" autoplay muted playsinline preload="auto">
      <source src="./videos/output.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- MAIN WEBSITE CONTENT -->
  <div id="site-content">

    <header class="site-header">
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="download.html">Download</a>
        <a href="create-account.html">Create Account</a>
        <a href="login.html">Login</a>
        <a href="about.html">About</a>
        <a href="lykos.html">Lykos</a>
        <a href="support.html">Support</a>
        <a href="terms.html">Terms & Privacy</a>
        <a href="legal.html">Legal</a>
      </nav>
    </header>

    <main class="section">
      <section class="hero">
        <h1>Welcome to Code‑X</h1>
        <p>A new platform for indie developers and players.</p>

        <div class="hero-buttons">
          <a href="create-account.html" class="btn-primary">Get Started</a>
          <a href="download.html" class="btn-secondary">Download Launcher</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a href="about.html">About</a>
      <a href="lykos.html">Lykos</a>
      <a href="support.html">Support</a>
      <a href="terms.html">Terms & Privacy</a>
      <a href="legal.html">Legal</a>
      <p>© 2026 Code‑X Interactive. All rights reserved.</p>
    </footer>

  </div>

  <!-- INTRO SCRIPT -->
  <script>
    document.getElementById("start-btn").addEventListener("click", () => {
      const overlay = document.getElementById("start-overlay");
      const intro = document.getElementById("intro-container");
      const video = document.getElementById("intro-video");
      const site = document.getElementById("site-content");

      overlay.style.display = "none";
      intro.style.display = "block";

      // Ensure video starts even if autoplay is blocked
      video.play().catch(() => {
        video.muted = true;
        video.play();
      });

      video.onended = () => {
        intro.style.display = "none";
        site.style.display = "block";
      };
    });
  </script>

</body>

</html>
