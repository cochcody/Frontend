<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Developer Dashboard | Code‑X</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../scripts/main.js" defer></script>
    <script src="../scripts/dev-dashboard.js" defer></script>
</head>

<body>
    <header class="site-header">
        <nav>
            <a href="/dashboard/user.html">Library</a>
            <a href="/dashboard/dev.html" class="active">Developer Dashboard</a>
            <a id="logout-link" href="#" style="cursor:pointer;">Logout</a>

        </nav>
    </header>

    <main class="section">
        <h1>Developer Dashboard</h1>

        <section class="section form-card">
            <h2>Upload a Game</h2>
            <form id="uploadForm" class="form" enctype="multipart/form-data">
                <div class="form-row">
                    <label>Game Title</label>
                    <input name="title" type="text" required>
                </div>

                <div class="form-row">
                    <label>Build File</label>
                    <input name="build" type="file" required>
                </div>

                <div class="form-row">
                    <label>Description</label>
                    <textarea name="description" rows="3" required></textarea>
                </div>

                <button class="btn primary" type="submit">Submit for Approval</button>
            </form>
        </section>
    </main>
</body>

</html>
