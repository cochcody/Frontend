<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Store | Code‑X</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../scripts/main.js" defer></script>
    <script src="../scripts/store-dashboard.js" defer></script>
</head>

<body>

    <header class="site-header">
        <nav>
            <a href="store.html" class="active">Store</a>
            <a href="user.html">Library</a>
            <a href="vault.html">Code‑X Vault</a>

            <span id="user-gamertag" style="margin-left:auto; padding-right:20px; font-weight:bold;"></span>

            <a id="logout-link" href="#" style="cursor:pointer;">Logout</a>
        </nav>
    </header>

    <main class="section">
        <h1>Store</h1>

        <div id="store-list">
            <!-- Filled by store-dashboard.js -->
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const gamertag = localStorage.getItem("gamertag");

            if (!gamertag) {
                window.location.href = "../login.html";
                return;
            }

            document.getElementById("user-gamertag").textContent = gamertag;

            document.getElementById("logout-link").addEventListener("click", () => {
                localStorage.clear();
                window.location.href = "../login.html";
            });
        });
    </script>

</body>

</html>
