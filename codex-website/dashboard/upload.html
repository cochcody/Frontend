<<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Upload Game | Code‑X</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- Minimal token helpers so upload.js works -->
    <script>
        function getToken() {
            return localStorage.getItem("token");
        }

        function clearToken() {
            localStorage.removeItem("token");
        }
    </script>

    <!-- Your actual scripts -->
    <script src="../scripts/main.js" defer></script>
    <script src="../scripts/upload.js" defer></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            // SIMPLE LOGIN CHECK — no developer role required
            const token = getToken();
            if (!token) {
                alert("You must be logged in to upload.");
                window.location.href = "../index.html";
                return;
            }

            const form = document.getElementById("uploadForm");
            if (form) {
                form.addEventListener("submit", handleUpload);
            }

            const logout = document.getElementById("logout-link");
            if (logout) {
                logout.addEventListener("click", () => {
                    clearToken();
                    window.location.href = "../index.html";
                });
            }
        });
    </script>
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <img src="../assets/logo.png" alt="Code‑X Logo">
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../download.html">Download</a>
            <a href="../contact.html">Support</a>
            <a href="../legal.html">Legal</a>
            <a id="logout-link">Logout</a>
        </nav>
    </header>

    <main class="dashboard-layout">

        <aside class="sidebar">
            <h2>Developer Menu</h2>
            <a href="index.html">Dashboard Home</a>
            <a href="upload.html" class="active">Upload Game</a>
            <a href="contact-dev.html">Developer Support</a>
            <a href="../index.html" onclick="clearToken()">Log Out</a>
        </aside>

        <section class="section form-card">
            <h1>Upload Game Build</h1>
            <p class="form-note">
                Upload your game metadata and build file (ZIP or EXE).
            </p>

            <form id="uploadForm" class="form" enctype="multipart/form-data">

                <div class="form-row">
                    <label for="id">Game ID</label>
                    <input id="id" name="id" type="text" required>
                </div>

                <div class="form-row">
                    <label for="name">Game Name</label>
                    <input id="name" name="name" type="text" required>
                </div>

                <div class="form-row">
                    <label for="price">Price (in cents)</label>
                    <input id="price" name="price" type="number" min="0" step="1" required>
                </div>

                <div class="form-row">
                    <label for="developer_account">Developer Stripe Account (optional)</label>
                    <input id="developer_account" name="developer_account" type="text">
                </div>

                <div class="form-row">
                    <label for="folder">Game Folder Name (optional)</label>
                    <input id="folder" name="folder" type="text">
                </div>

                <div class="form-row">
                    <label for="build">Build File (ZIP or EXE)</label>
                    <input id="build" name="build" type="file" accept=".zip,.exe" required>
                </div>

                <button class="btn primary" type="submit">Upload Build</button>

            </form>
        </section>

    </main>

    <footer class="site-footer">
        <div>© 2026 Code‑X. All rights reserved.</div>
        <div class="footer-links">
            <a href="../legal.html">Legal</a>
        </div>
    </footer>

</body>

</html>
