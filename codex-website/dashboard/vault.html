<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Code‑X Vault | Developer Application</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../scripts/main.js" defer></script>
    <script src="vault.js" defer></script>
</head>

<body>
    <header class="site-header">
        <nav>
            <a href="/dashboard/user.html">Library</a>
            <a href="/dashboard/vault.html" class="active">Code‑X Vault</a>
            <a id="logout-link" href="#" style="cursor:pointer;">Logout</a>

        </nav>
    </header>

    <main class="section form-card">
        <h1>Apply as a Developer</h1>
        <p>Submit a request to become a Code‑X developer.</p>

        <form id="vaultForm">
            <label>
                Company
                <input name="company" autocomplete="organization" required>
            </label>
            <label>
                Website
                <input name="website" autocomplete="url">
            </label>
            <label>
                Description
                <textarea name="description" autocomplete="off" required></textarea>
            </label>
            <button type="submit">Submit Application</button>
        </form>
    </main>
</body>

</html>
