<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Code‑X Admin Dashboard</title>

    <!-- Global site styles -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Admin-specific styles -->
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="logo">
            <img src="../assets/logo.png" alt="Code‑X Logo">
        </div>

        <nav>
            <nav>
                <a id="home-link">Home</a>
                <a class="active">Admin</a>
                <a id="logout-btn" href="#" style="cursor:pointer;">Logout</a>

            </nav>

        </nav>
    </header>

    <!-- MAIN -->
    <main>
        <h1>Admin Dashboard</h1>

        <div class="dashboard-layout">

            <!-- SIDEBAR -->
            <aside class="sidebar">
                <h2>Navigation</h2>
                <a data-section="uploads" class="active">Developer Uploads</a>
                <a data-section="store">Store Management</a>
                <a data-section="users">Users</a>
                <a data-section="analytics">Analytics</a>
            
                <!-- NEW: Developer Applications -->
                <a href="/admin/dev-applications.html">Developer Applications</a>
            </aside>


            <!-- CONTENT -->
            <div class="content">

                <!-- UPLOADS -->
                <section id="section-uploads" class="section active">
                    <h2>Developer Uploads</h2>
                    <div id="uploads-container"></div>
                </section>

                <!-- STORE -->
                <section id="section-store" class="section">
                    <h2>Store Management</h2>
                
                    <div id="store-games-container" class="store-grid"></div>
                </section>


                <!-- USERS -->
                <section id="section-users" class="section">
                    <h2>User Accounts</h2>
                    <p>Coming soon.</p>
                </section>

                <!-- ANALYTICS -->
                <section id="section-analytics" class="section">
                    <h2>Analytics</h2>
                    <p>Coming soon.</p>
                </section>

            </div>
        </div>
    </main>

    <!-- ADMIN JS -->
    <script src="/scripts/main.js" defer></script>
    <script src="admin.js"></script>

</body>

</html>
