<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin • User Details</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../scripts/main.js" defer></script>
    <script src="admin.js" defer></script>

    <script defer>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const email = params.get("email");

            if (!email) {
                document.getElementById("userDetails").innerHTML = "<p>No user selected.</p>";
                return;
            }

            const token = localStorage.getItem("codex_token");

            try {
                const res = await fetch(`${BASE_URL}/api/admin/user/${email}`, {
                    headers: { Authorization: "Bearer " + token }
                });

                const user = await res.json();

                document.getElementById("user-email").textContent = user.email;
                document.getElementById("user-gamertag").textContent = user.gamertag;
                document.getElementById("user-role").textContent = user.role;
                document.getElementById("user-status").textContent = user.status;

                document.getElementById("promoteBtn").onclick = () => promoteUser(email);
                document.getElementById("demoteBtn").onclick = () => demoteUser(email);
                document.getElementById("suspendBtn").onclick = () => suspendUser(email);
                document.getElementById("unsuspendBtn").onclick = () => unsuspendUser(email);
                document.getElementById("banBtn").onclick = () => banUser(email);
                document.getElementById("unbanBtn").onclick = () => unbanUser(email);

            } catch (err) {
                console.error("Error loading user:", err);
                document.getElementById("userDetails").innerHTML = "<p>Error loading user.</p>";
            }
        });
    </script>
</head>

<body>

    <header class="site-header">
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="store-management.html">Store Management</a>
            <a href="users-management.html">User Management</a>
            <a href="analytics.html">Analytics</a>
            <a href="dev-applications.html">Developer Applications</a>
            <a href="game-approval.html">Game Aproval</a>
            <a id="logout-btn" href="#">Logout</a>
        </nav>
    </header>

    <main class="section">
        <h1>User Details</h1>

        <div id="userDetails" class="user-card">
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <p><strong>Gamertag:</strong> <span id="user-gamertag"></span></p>
            <p><strong>Role:</strong> <span id="user-role"></span></p>
            <p><strong>Status:</strong> <span id="user-status"></span></p>

            <div class="user-actions">
                <button id="promoteBtn">Promote</button>
                <button id="demoteBtn">Demote</button>
                <button id="suspendBtn">Suspend</button>
                <button id="unsuspendBtn">Unsuspend</button>
                <button id="banBtn">Ban</button>
                <button id="unbanBtn">Unban</button>
            </div>
        </div>

    </main>

</body>

</html>
