        <h1>Analytics</h1>

        <section id="section-analytics" class="section active">

                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p id="stat-users">Loading...</p>
                </div>

                <div class="stat-card">
                    <h3>Total Developers</h3>
                    <p id="stat-devs">Loading...</p>
                </div>

                <div class="stat-card">
                    <h3>Total Games</h3>
                    <p id="stat-games">Loading...</p>
                </div>

                <div class="stat-card">
                    <h3>Approved Uploads</h3>
                    <p id="stat-approved">Loading...</p>
                </div>

                <div class="stat-card">
                    <h3>Pending Uploads</h3>
                    <p id="stat-pending">Loading...</p>
                </div>

                <div class="stat-card">
                    <h3>Featured Games</h3>
                    <p id="stat-featured">Loading...</p>
                </div>

                <div class="stat-card">
                    <h3>Hidden Games</h3>
                    <p id="stat-hidden">Loading...</p>
                </div>

            </div>
