<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Support | Code‑X</title>

    <!-- Correct CSS path -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JS path -->
    <script src="scripts/main.js" defer></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("supportForm");
            form.addEventListener("submit", handlePublicContact);
        });
    </script>
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="logo">
            <img src="assets/logo.png" alt="Code‑X Logo">
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="download.html">Download</a>
            <a href="create-account.html">Create Account</a>
            <a href="login.html">Login</a>
            <a href="contact.html" class="active">Support</a>
            <a href="legal.html">Legal</a>
            <a id="logout-link">Logout</a>

        </nav>
    </header>


    <!-- MAIN -->
    <main>
        <section class="section form-card">
            <h1>Support</h1>
            <p class="form-note">Need help? Send us a message and we’ll get back to you.</p>

            <form id="supportForm" class="form">

                <div class="form-row">
                    <label for="name">Your Name</label>
                    <input id="name" name="name" type="text" required>
                </div>

                <div class="form-row">
                    <label for="email">Your Email</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-row">
                    <label for="issueType">Issue Type</label>
                    <select id="issueType" name="issueType" required>
                        <option value="">Select one...</option>
                        <option value="account">Account Issue</option>
                        <option value="launcher">Launcher Issue</option>
                        <option value="game">Game Issue</option>
                        <option value="billing">Billing / Purchase</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button class="btn primary" type="submit">Send Message</button>

            </form>
        </section>
    </main>


    <!-- FOOTER -->
    <footer class="site-footer">
        <div>© 2026 Code‑X. All rights reserved.</div>

        <div class="footer-links">
            <a href="legal.html">Legal</a>
        </div>
    </footer>

</body>

</html>
