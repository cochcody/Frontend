<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Code‑X Vault | Developer</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../scripts/main.js" defer></script>
    <script src="../scripts/vault.js" defer></script>
</head>

<body>
    <header class="site-header">
        <nav>
            <a href="/dashboard/user.html">Library</a>
            <a href="/dashboard/vault.html" class="active">Code‑X Vault</a>
            <a id="logout-link">Logout</a>
        </nav>
    </header>

    <main class="section form-card">
        <h1>Apply as a Developer</h1>
        <p>Submit a request to become a Code‑X developer and upload your games through Code‑X Vault.</p>

        <form id="devApplyForm" class="form">
            <div class="form-row">
                <label>Studio / Developer Name</label>
                <input name="company" type="text" required>
            </div>

            <div class="form-row">
                <label>Portfolio / Website (optional)</label>
                <input name="website" type="url">
            </div>

            <div class="form-row">
                <label>Tell us about your games</label>
                <textarea name="description" rows="4" required></textarea>
            </div>

            <button class="btn primary" type="submit">Submit Application</button>
        </form>
    </main>

</body>

</html>
